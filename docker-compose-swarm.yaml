services:
  frontend:
    image: eventmanager/frontend:1.0
    ports:
      - "4200:80"
    environment:
      - API_URL=http://backend:5000
    networks:
      - eventmanager_network
    depends_on:
      - backend

  backend:
    image: eventmanager/backend:1.0
    environment:
      - MONGO_URI=mongodb://mongodb:27017/your_database_name
      - SECRET_KEY=${SECRET_KEY:-insecure-local-dev-key}
    networks:
      - eventmanager_network
    depends_on:
      - mongodb
    deploy:
      replicas: 3
      update_config:
        parallelism: 2
        delay: 10s
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  mongodb:
    image: eventmanager/mongodb:1.0
    networks:
      - eventmanager_network
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=your_database_name

networks:
  eventmanager_network:
    driver: overlay

volumes:
  mongodb_data: